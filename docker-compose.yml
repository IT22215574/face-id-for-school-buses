version: '3.9'

services:
  api:
    build:
      context: ./backend
    container_name: school-bus-api
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://schoolbus:schoolbus@db:5432/schoolbus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    container_name: school-bus-db
    environment:
      POSTGRES_USER: schoolbus
      POSTGRES_PASSWORD: schoolbus
      POSTGRES_DB: schoolbus
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: school-bus-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:

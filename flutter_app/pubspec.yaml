name: school_bus_parent_app
description: School Bus Parent App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  dio: ^5.7.0
  flutter_riverpod: ^2.5.1
  geolocator: ^13.0.4
  google_maps_flutter: ^2.7.1
  firebase_auth: ^5.0.0
  firebase_database: ^11.0.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.4.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
